name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python and shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install flake8==7.1.1

      - name: Check Python for syntax errors and undefined names
        run: flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check shell scripts
        run: shellcheck --severity=error check-lab13.sh create-secret.sh

  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: kubeconform -summary -ignore-missing-schemas k8s/

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, validate-k8s]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build Flask API image
        run: docker build -t ticket-app:${{ github.sha }} ./app

      - name: Build Apache web image
        run: docker build -t ticket-web:${{ github.sha }} ./apache

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

    sonarqube:
      name: SonarQube Cloud scan
      runs-on: ubuntu-latest
      steps:
        - name: Check out code
          uses: actions/checkout@v5
          with:
            fetch-depth: 0

        - name: Cache SonarQube packages
          uses: actions/cache@v4
          with:
            path: ~/.sonar/cache
            key: ${{ runner.os }}-sonar
            restore-keys: ${{ runner.os }}-sonar

        - name: SonarQube Cloud scan
          uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
