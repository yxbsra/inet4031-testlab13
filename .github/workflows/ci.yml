name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python and shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --only-binary :all: -r app/requirements.txt
          pip install --only-binary :all: flake8==7.1.1

      - name: Check Python for syntax errors and undefined names
        run: flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check shell scripts
        run: shellcheck --severity=error check-lab13.sh create-secret.sh

  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: kubeconform -summary -ignore-missing-schemas k8s/

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, validate-k8s]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build Flask API image
        run: docker build -t ticket-app:${{ github.sha }} ./app

      - name: Build Apache web image
        run: docker build -t ticket-web:${{ github.sha }} ./apache

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  sonarqube:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dast:
    name: OWASP ZAP DAST scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build images
        run: |
          docker build -t ticket-app:ci ./app
          docker build -t ticket-web:ci ./apache

      - name: Start the full stack
        run: |
          # Random throwaway password for this run only; masked in logs
          DB_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$DB_PASSWORD"
          docker network create ticket-net
          docker run -d --name db --network ticket-net \
            -e MARIADB_RANDOM_ROOT_PASSWORD=1 \
            -e MARIADB_DATABASE=ticketdb \
            -e MARIADB_USER=flaskuser \
            -e MARIADB_PASSWORD="$DB_PASSWORD" \
            -v "$PWD/app/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            mariadb:11
          docker run -d --name app --network ticket-net \
            -e DB_HOST=db \
            -e DB_NAME=ticketdb \
            -e DB_USER=flaskuser \
            -e DB_PASSWORD="$DB_PASSWORD" \
            ticket-app:ci
          docker run -d --name web --network ticket-net -p 8080:80 ticket-web:ci

      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              echo ""
              echo "App is healthy"
              exit 0
             fi
             sleep 5
           done
           echo "App did not become healthy"
           docker logs db
           docker logs app
           docker logs web
           exit 1

       - name: Run OWASP ZAP baseline scan
         run: |
           mkdir -p zap-report
           chmod 777 zap-report
           docker run --rm --network ticket-net \
             -v "$PWD/zap-report:/zap/wrk:rw" \
             ghcr.io/zaproxy/zaproxy:stable \
             zap-baseline.py -t http://web -r zap-report.html -J zap-report.json -I

       - name: Upload ZAP report
         if: always()
         uses: actions/upload-artifact@v4
         with:
           name: zap-report
           path: zap-report/
